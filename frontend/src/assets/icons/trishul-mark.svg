<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" fill="currentColor" role="img" aria-label="Trishul mark">
  <!-- Shaft -->
  <rect x="93" y="145" width="14" height="105" rx="2"/>

  <!-- Binding wrap where prongs meet shaft -->
  <path d="M74 140 Q100 156 126 140 L126 150 Q100 166 74 150 Z"/>

  <!-- Left tine: rises, curves outward at top like a trident prong -->
  <path d="M96 148
           L88 148
           C70 148 56 134 54 114
           C53 100 58 86 68 76
           L78 66
           C72 82 74 98 82 110
           C86 116 91 120 96 122
           Z"/>

  <!-- Right tine: mirrored -->
  <path d="M104 148
           L112 148
           C130 148 144 134 146 114
           C147 100 142 86 132 76
           L122 66
           C128 82 126 98 118 110
           C114 116 109 120 104 122
           Z"/>

  <!-- Center prong: straight spike, reinterpreted with a rising sensor-line notch -->
  <path d="M100 18 L110 100 L100 122 L90 100 Z"/>

  <!-- Rising reading ticks up the center prong, like a climbing sensor trace -->
  <rect x="78" y="96" width="9" height="3"/>
  <rect x="86" y="80" width="9" height="3" transform="rotate(-18 90.5 81.5)"/>
  <rect x="96" y="56" width="9" height="3" transform="rotate(-32 100.5 57.5)"/>
</svg>
