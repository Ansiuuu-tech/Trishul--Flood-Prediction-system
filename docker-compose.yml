version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: himalaya
      POSTGRES_PASSWORD: himalaya
      POSTGRES_DB: himalayashield
    ports:
      - "5432:5432"
    volumes:
      - himalaya_pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himalaya -d himalayashield"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://himalaya:himalaya@postgres:5432/himalayashield
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://frontend
      DEMO_MODE: "true"
      SIMULATION_INTERVAL_SECONDS: "2"
      ALERT_COOLDOWN_SECONDS: "120"
      # Optional alerting - leave blank for demo mode:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  himalaya_pgdata:
